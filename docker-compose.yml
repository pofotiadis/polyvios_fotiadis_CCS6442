
services:
  app:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres/postgres"
    env_file:
      - .env.example
    depends_on:
      - postgres
  postgres:
    image: postgres:11.5-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env.example
    volumes:
      - ./postgres-data:/var/lib/postgresql/data:cached
  checkstatus:
    build:
      context: ./src
      dockerfile: Production-Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
    depends_on:
      - postgres
